spring:
  application:
    name: report-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://barofit-prod-postgres.czaikwsmwix7.ap-northeast-2.rds.amazonaws.com:5432/barofit}
    username: ${DB_USERNAME:report_user}
    password: ${DB_PASSWORD:}
    hikari:
      schema: report
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: report
  flyway:
    enabled: false
barofit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
  workout:
    base-url: ${WORKOUT_BASE_URL:http://localhost:3006}
  routine:
    base-url: ${ROUTINE_BASE_URL:http://localhost:3005}
server:
  port: ${REPORT_PORT:3008}
