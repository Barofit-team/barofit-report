plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.barofit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.pkg.github.com/Barofit-team/barofit-common')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: ''
            password = System.getenv('GITHUB_TOKEN') ?: ''
        }
    }
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'com.barofit:barofit-runtime:0.0.1-SNAPSHOT'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ???덊룷 ?먯떊??而댄룷?뚰듃/?듯빀 ?뚯뒪??(Testcontainers 湲곕컲)
    integrationTestImplementation('com.barofit:barofit-runtime:0.0.1-SNAPSHOT') {
        capabilities {
            requireCapability('com.barofit:runtime-test-fixtures')
        }
    }
    // ReportSchemaMigrationTest???ㅽ궎留덈? ?듭㎏濡?吏?곕뒗 ?뚭눼???뚯뒪?몃씪 怨듭쑀 而⑦뀒?대꼫 ???
    // ?낅┰??而⑦뀒?대꼫瑜?洹몃?濡??대떎 (barofit-common 履쎌뿉 ?녿뒗 ?쒖닔 testcontainers ?섏〈??
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = '???덊룷 ?먯떊??而댄룷?뚰듃 ?듯빀 ?뚯뒪??(Testcontainers, Docker ?꾩슂)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
    jvmArgumentProviders.add(
        { ["-Dbarofit.test.postgres-image=postgres:18.6"] } as CommandLineArgumentProvider)
}

tasks.named('check') { dependsOn integrationTest }
tasks.named('bootJar') { archiveFileName = 'app.jar' }

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('bootRun') { workingDir = rootProject.projectDir }
